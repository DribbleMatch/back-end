version: '3.4'

services:
  redis:
    image: redis
    ports:
      - 6379:6379
  clutchshot:
    image: juhyunpark/clutchshot
    build:
      context: .
      dockerfile: ./Dockerfile
    ports:
      - 8080:8080
    depends_on:
      - redis
    env_file:
      - clutchShot-prod.env
    volumes:
      - /home/ec2-user/images:/app/images