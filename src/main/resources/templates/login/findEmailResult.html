<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{layouts/login_layout}"
      lang="ko">
<th:block layout:fragment="script">
    <script th:src="@{/js/login/forgetUserInfo.js}"></script>
</th:block>

<div layout:fragment="content" class="container login-container d-flex flex-column align-items-center">
    <div class="mt-3 mb-4 text-center fs-4"
         th:text="${emailInfoList.isEmpty()} ? '가입된 이메일이 없습니다.' : '귀하의 이메일은 다음과 같습니다.'"></div>

    <div class="w-100 mb-3 d-flex flex-column justify-content-center gap-2" th:if="${!emailInfoList.isEmpty()}"
         th:each="emailInfo, iterStat : ${emailInfoList}">
        <div class="email" th:text="'이메일: ' + ${emailInfo.name}"></div>
        <div class="email" th:text="'가입일: ' + ${#temporals.format(emailInfo.createdAt, 'yyyy-MM-dd')}"></div>
        <hr th:if="${!iterStat.last}" class="m-0">
    </div>

    <div class="mb-4 d-flex justify-content-center">
        <button type="button" class="basic-btn" th:if="${!emailInfoList.isEmpty()}" onclick="goToPage('/page/login')">
            로그인 하기
        </button>
        <button type="button" class="w-100 basic-btn" th:if="${emailInfoList.isEmpty()}"
                onclick="goToPage('/page/login')">회원가입 하기
        </button>
    </div>
</div>
</html>
