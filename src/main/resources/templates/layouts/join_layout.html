<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1">

        <title>DribbleMatch - 농구 메이트를 만나보세요!</title>

        <!--CUSTOM CSS-->
        <link rel="stylesheet" href="/css/fragments/flow-bar.css">
        <link rel="stylesheet" href="/css/fragments/header.css">
        <link rel="stylesheet" href="/css/fragments/leftMenu.css">
        <link rel="stylesheet" href="/css/layout.css">

        <!--BootStrap CSS-->
        <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
        <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>

        <!--JQuery-->
        <script src="https://code.jquery.com/jquery-latest.js"></script>

        <!--JS-->
        <script src="/js/common/common.js"></script>

        <th:block layout:fragment="css"></th:block>
        <th:block layout:fragment="script"></th:block>
    </head>
      <body>
          <div th:replace="fragments/header::header"></div>
          <div th:replace="fragments/flow-bar::flow-bar"></div>
          <div th:replace="fragments/leftMenu::left-menu"></div>
          <div layout:fragment="content"></div>
      </body>
</html>
