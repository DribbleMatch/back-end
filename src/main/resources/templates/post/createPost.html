<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{layouts/default}">
<th:block layout:fragment="css">
    <link rel="stylesheet" th:href="@{/css/post/createPost.css}">
    <link rel="stylesheet" th:href="@{//uicdn.toast.com/editor/latest/toastui-editor.min.css}">
</th:block>
<th:block layout:fragment="script">
    <script th:src="@{//uicdn.toast.com/editor/latest/toastui-editor-all.min.js}"></script>
    <script th:src="@{/js/post/createPost.js}"></script>
</th:block>

<div layout:fragment="content" class="container p-0 d-flex flex-column align-items-center">
    <div class="basic-title mb-4">공지 등록</div>
    <form class="col-12 col-md-6 d-flex flex-column align-items-center">
        <div class="col-12 mb-5 d-flex flex-column">
            <label for="title" class="basic-input-title ms-2 d-flex flex-row flex-column-m">
                공지 제목
            </label>
            <input type="text" class="basic-input mt-2" id="title" name="title"/>
        </div>

        <div class="col-12 mb-5 d-flex flex-column">
            <label for="content" class="basic-input-title ms-2 d-flex flex-row flex-column-m">
                공지 내용
            </label>
            <div id="content"></div>
        </div>

        <div class="col-12 mb-5 d-flex flex-column">
            <label class="basic-input-title ms-2 d-flex flex-row flex-column-m">
                공지 설정
            </label>
            <div class="col-12 mt-4 d-flex flex-column gap-4">
                <div class="col-12 d-flex flex-row flex-column-m gap-4">
                    <div class="col-6 col-md-2 me-4 align-content-center text-start">공개 여부</div>
                    <div class="col-4 d-flex gap-5">
                        <label class="col-5 d-flex flex-column align-items-center fs-6">
                            <input type="radio" name="post-status" value="SHOW" checked>
                            공개
                        </label>
                        <label class="col-5 d-flex flex-column align-items-center fs-6">
                            <input type="radio" name="post-status" value="HIDE">
                            비공개
                        </label>
                    </div>
                </div>

                <div class="col-12 d-flex flex-row flex-column-m gap-4">
                    <div class="col-6 col-md-2 me-4 align-content-center text-start">배너 유무</div>
                    <div class="col-4 d-flex gap-5" onclick="toggleBannerInfo()">
                        <label class="col-5 d-flex flex-column align-items-center fs-6">
                            <input type="radio" name="has-banner" value="BANNER" checked>
                            배너 생성
                        </label>
                        <label class="col-5 d-flex flex-column align-items-center fs-6">
                            <input type="radio" name="has-banner" value="NO_BANNER">
                            배너 미생성
                        </label>
                    </div>
                </div>
            </div>
        </div>

        <div class="col-12 mb-5 d-flex flex-column" id="banner-div">
            <label class="basic-input-title ms-2 d-flex flex-row flex-column-m">
                배너 설정
            </label>
            <div class="col-12 mt-4 d-flex flex-column gap-4">
                <div class="col-12 d-flex flex-column-m gap-4">
                    <div class="col-6 col-md-2 me-4 align-content-center text-start">노출 기간</div>
                    <label class="col-6 d-flex align-items-center fs-6">
                        <input type="date" class="basic-input col-12 col-md-8 text-center" id="banner-start"/>
                        <i class="bi bi-dash mx-3"></i>
                        <input type="date" class="basic-input col-12 col-md-8 text-center" id="banner-end"/>
                    </label>
                </div>

                <div class="col-12 d-flex flex-row flex-column-m gap-4">
                    <div class="col-6 col-md-2 me-4 align-content-center text-start">배너 유무</div>
                    <div class="col-4 d-flex gap-5" onclick="toggleBannerInfo()">
                        <label class="col-5 d-flex flex-column align-items-center fs-6">
                            <input type="radio" name="has-banner" value="BANNER" checked>
                            배너 생성
                        </label>
                        <label class="col-5 d-flex flex-column align-items-center fs-6">
                            <input type="radio" name="has-banner" value="NO_BANNER">
                            배너 미생성
                        </label>
                    </div>
                </div>
            </div>
            <div class="info-container info-container-sub mb4">
                <div class="sub-input">
                    <div class="sub-title mr8">노출 기간</div>
                    <div class="date-div">
                        <input type="date" class="banner-date" id="banner-start"/>
                        <div class="text-to-emo">~</div>
                        <input type="date" class="banner-date" id="banner-end"/>
                    </div>
                </div>
                <div class="sub-input">
                    <div class="sub-title mr7">이미지 파일</div>
                    <div class="img-input">
                        <input type="file" id="banner-image" accept="image/*" onchange="previewImage()">
                        <div class="sub-text" id="banner-img-preview">미리보기</div>
                        <div class="img-preview">
                            <img class="preview" id="preview" src="" alt="이미지 미리보기" style="display: none;">
                        </div>
                    </div>
                </div>
            </div>
        </div>

        <div class="submit-btn-div">
            <button type="button" class="submit-btn" onclick="createPost()">공지 생성</button>
        </div>
    </form>
</div>
</html>
