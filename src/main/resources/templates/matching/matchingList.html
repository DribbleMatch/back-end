<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{layouts/matching_layout}">
<th:block layout:fragment="css">
    <link rel="stylesheet" th:href="@{/css/matching/matchingList.css}">
</th:block>
<th:block layout:fragment="script">
    <script th:src="@{/js/common/region.js}"></script>
    <script th:src="@{/js/matching/matchingList.js}"></script>
    <script th:src="@{/js/common/matchingCommon.js}"></script>
</th:block>

<div layout:fragment="content" class="container d-flex flex-column align-items-center">
    <div class="col-12 col-md-7 d-flex position-relative mb-5">
        <div class="col-12 date-div-list d-flex justify-content-center position-relative third-bg-color rounded overflow-hidden gap-5">
            <div th:each="date, stat : ${dateList}"
                 th:classappend="${stat.index == 2} ? 'black'"
                 class="date-div"
                 th:text="${#temporals.format(date, 'dd / (EEE)')}"
                 th:attr="date=${#temporals.format(date, 'yyyy-MM-dd')}">
            </div>
            <div class="click-div first" onclick="slideRight(2)"></div>
            <div class="click-div second" onclick="slideRight(1)"></div>
            <div class="click-div third" onclick="slideLeft(1)"></div>
            <div class="click-div fourth" onclick="slideLeft(2)"></div>
        </div>
        <div class="d-flex align-items-center position-absolute top-50 start-50 translate-middle gap-3">
            <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" fill="currentColor" class="bi bi-chevron-left cs-p second-color" viewBox="0 0 16 16" stroke="currentColor" stroke-width="1.5"
                 id="prevButton" onclick="slideRight(1)">
                <path fill-rule="evenodd" d="M11.354 1.646a.5.5 0 0 1 0 .708L5.707 8l5.647 5.646a.5.5 0 0 1-.708.708l-6-6a.5.5 0 0 1 0-.708l6-6a.5.5 0 0 1 .708 0"/>
            </svg>
            <div class="now-date-border"></div>
            <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" fill="currentColor" class="bi bi-chevron-right cs-p second-color" viewBox="0 0 16 16" stroke="currentColor" stroke-width="1.5"
                 id="nextButton" onclick="slideLeft(1)">
                <path fill-rule="evenodd" d="M4.646 1.646a.5.5 0 0 1 .708 0l6 6a.5.5 0 0 1 0 .708l-6 6a.5.5 0 0 1-.708-.708L10.293 8 4.646 2.354a.5.5 0 0 1 0-.708"/>
            </svg>
        </div>
    </div>

    <div class="show-only-mobile">
        <div class="date-div-mobile"
             th:each="date, stat : ${mobileDateList}"
             th:classappend="${stat.index == 0} ? 'select-date-div'"
             th:utext="${#temporals.format(date, 'dd')} + '<br>(' + ${#temporals.format(date, 'EEE')} + ')'"
             th:attr="date=${#temporals.format(date, 'yyyy-MM-dd')}"
             onclick="changeSelectDateStyle(this)">
        </div>
    </div>

    <div class="col-12 col-md-7">
        <div class="d-flex align-items-center justify-content-center position-relative gap-3">
            <input class="col-9 px-2 border border-2 border-secondary rounded search-bar" type="text" id="search-word" placeholder="경기 명 또는 지역 검색..."
                   oninput="searchMatching()" />
            <i class="bi bi-search position-absolute second-color fs-5 cs-p"></i>
            <div class="position-relative">
                <svg class="plus-icon" width="30" height="30" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
                    <path d="M12 5V19M5 12H19" stroke="#333333" stroke-width="1" stroke-linecap="round" stroke-linejoin="round"/>
                </svg>
                <div class="plus-menu hide-toggle position-absolute bg-white shadow rounded-1">
                    <div class="menu-item p-2 cs-p" onclick="goToPage('/page/matching/create')">경기 생성</div>
                    <div class="menu-item p-2 cs-p">내 경기</div>
                </div>
            </div>
        </div>

        <div class="matching-list" id="matching-list">
            <div th:each="matching : ${matchingList}" class="matching-card">
                <div class="matching-time">
                    <h1 th:text="${#temporals.format(matching.startAt, 'HH:mm')}">12:12</h1>
                </div>
                <div class="matching-info">
                    <div class="matching-name-div">
                        <div class="matching-name" th:text="${matching.name}"
                             th:onclick="'goMatchingDetail('+ ${matching.id} +')'"></div>
                        <div th:if="${matching.isOnlyWomen.toString() == 'ONLY_WOMEN'}" class="is-only-women">
                            여성전용
                        </div>
                    </div>
                    <div class="matching-kind"
                         th:text="${matching.gameKind.toString() == 'TEAM' ? '팀 경기 ' : '개인 경기 '} + ${matching.playMemberNum} + ' VS ' + ${matching.playMemberNum} + ' (모집 인원: 팀 당 ' + ${matching.maxMemberNum} + '명)'">
                        팀 경기 3 VS 3 (모집 인원: 팀 당 3명)
                    </div>
                    <div class="matching-region"
                         th:text="${matching.regionString} + ' (' + ${matching.isReservedStadium.toString() == 'RESERVED' ? '경기장 확정' : '경기장 미정'} + ')'">
                        서울시 영등포구 (경기장 미정)
                    </div>
                </div>
                <div class="hour-div" th:text="${matching.hour} + '시간'">
                    3시간
                </div>
                <div class="join-info-div">
                    <button type="button">모집중</button>
                </div>
            </div>
            <div th:if="${matchingList.totalElements == 0}" class="no-data">
                해당 날에 경기가 아직 없습니다.
            </div>
            <div th:if="${matchingList.totalElements != 0}"
                 th:include="fragments/pagination :: pagination(${currentPage}, ${totalPage})"></div>
        </div>
    </div>
</div>
</html>
